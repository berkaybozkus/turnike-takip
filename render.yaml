services:
  - type: web
    name: turnike-takip
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: CANLI_DEMO
        value: "1"
      - key: TZ
        value: Europe/Istanbul
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: OTURUM_ANAHTARI
        generateValue: true
